name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish ARM64 Release
    runs-on: macos-26
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH format: ${tag}" >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "${tag}")" != "tag" ]]; then
            echo "Release tags must be annotated: ${tag}" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse "${tag}^{commit}")"
          if ! git merge-base --is-ancestor "${tagged_commit}" origin/main; then
            echo "Tagged commit ${tagged_commit} is not on main" >&2
            exit 1
          fi

          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "arm64"

      - name: Install packaging dependency
        run: brew install librsvg

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package DMG
        run: make dmg VERSION="${{ steps.release.outputs.version }}" ARCH=arm64

      - name: Validate release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          app="Hotkey.app"
          plist="${app}/Contents/Info.plist"
          executable="${app}/Contents/MacOS/Hotkey"
          dmg="dist/Hotkey-v${VERSION}-arm64.dmg"
          checksum="${dmg}.sha256"

          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")" == "${VERSION}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}")" == "${VERSION}" ]]
          [[ "$(lipo -archs "${executable}")" == "arm64" ]]

          hdiutil verify "${dmg}"

          mount_dir="$(mktemp -d)"
          attached=false
          cleanup() {
            if [[ "${attached}" == "true" ]]; then
              hdiutil detach "${mount_dir}" >/dev/null
            fi
            rmdir "${mount_dir}" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "${dmg}" -readonly -nobrowse -mountpoint "${mount_dir}" >/dev/null
          attached=true
          [[ -d "${mount_dir}/Hotkey.app" ]]
          [[ -L "${mount_dir}/Applications" ]]
          [[ "$(readlink "${mount_dir}/Applications")" == "/Applications" ]]
          hdiutil detach "${mount_dir}" >/dev/null
          attached=false
          rmdir "${mount_dir}"
          trap - EXIT

          (cd dist && shasum -a 256 -c "$(basename "${checksum}")")

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/Hotkey-v${VERSION}-arm64.dmg" \
            "dist/Hotkey-v${VERSION}-arm64.dmg.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Hotkey ${GITHUB_REF_NAME}"
