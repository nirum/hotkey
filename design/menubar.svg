<svg xmlns="http://www.w3.org/2000/svg" width="28" height="22" viewBox="0 0 28 22">
  <!--
    Hotkey — menu bar template image
    ================================
    Same lockup as design/icon.svg, rendered as a template: pure black plus
    alpha, no colour. macOS tints it for the light and dark menu bar, inverts
    it while the menu is open, and honours accent tinting — none of which it
    can do while the image carries colour of its own.

    Canvas 28 × 22 at 1×. A ⌘H pair does not fit a square status item, so
    AppDelegate uses NSStatusItem.variableLength and this asset's own aspect.

    Sized in situ against the system glyphs, not on the drawing board: 14px of
    content in the 22px bar, with the stroke opened to 72 against the app
    icon's 42. A 22pt glyph needs far more weight than a 1024px mark to read
    at the same density, and shrinking it needs more again. Everything else —
    the knot geometry, the 86% overshoot on the H — is unchanged.

      content     14px tall, centred in 22
      stroke      1.44px @1× · 2.87px @2×
      loop counter 2.55px @1× — the binding constraint; opening the stroke
                   further closes it and the knot goes blobby
  -->
  <g transform="translate(14 11) scale(0.019943) translate(-226.5 0)" fill="#000000">
    <!-- ⌘ : four straight runs, each pair joined by a 270° outward loop -->
    <path d="M -215 -115
             L  215 -115
             A 100 100 0 1 0  115 -215
             L  115  215
             A 100 100 0 1 0  215  115
             L -215  115
             A 100 100 0 1 0 -115  215
             L -115 -215
             A 100 100 0 1 0 -215 -115 Z"
          fill="none" stroke="#000000" stroke-width="72"/>

    <!-- H : monoline, stroke weight matched to the knot, 86% of its height -->
    <rect x="424" y="-302" width="72" height="604"/>
    <rect x="732" y="-302" width="72" height="604"/>
    <rect x="424" y="-36"  width="380" height="72"/>
  </g>
</svg>
